<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Required</title>

<style nonce="{{ .Nonce }}">
    /* --- Base & Light Mode Styles --- */
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        margin: 0;
    }

    :root {
        /* Text and Primary Colors */
        --text-color: #333;
        --primary-color: #007bff;
        --background-color: #f7f9fb;
        --container-bg: white;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        --border-color: #dee2e6;
        --error-color: #dc3545;
        --input-bg: white;
        --button-hover: #0069d9;

        --app-height: 100vh;
    }

    body {
        font-family: Inter, system-ui, sans-serif;
        font-size: 16px;
        background-color: var(--background-color);
        color: var(--text-color);
        padding: 20px;
        overflow-y: auto;

        /* Flexbox Centering */
        min-height: var(--app-height);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Mobile viewport height fix */
    @supports (height: 100lvh) {
      body {
        min-height: 100lvh;
      }
    }

    /* Fallback for older browsers without lvh support */
    @media (max-width: 440px) {
        body {
            min-height: 100%;
        }
    }


    .container {
        text-align: center;
        width: 100%;
        max-width: 400px;
        background-color: var(--container-bg);
        padding: 30px;
        border-radius: 8px;
        box-shadow: var(--shadow);
        box-sizing: border-box;
    }

    /* Small screen adjustments */
    @media (max-width: 440px) {
        .container {
            padding: 20px;
        }
        body {
            padding: 10px;
        }
    }


    h1 {
        font-size: 24px;
        font-family: Poppins, system-ui, sans-serif;
        font-weight: 600;
        color: var(--text-color);
        margin-bottom: 1em;
    }

    .description {
        padding: 0 8px;
        font-size: 1em;
        color: #6c757d;
        margin-bottom: 2.5em;
        line-height: 1.5;
    }

    .form-group {
        text-align: center;
    }

    input[type="password"] {
        width: 100%;
        padding: 12px;
        font-size: 1em;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background-color: var(--input-bg);
        color: var(--text-color);
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        outline: none;
    }

    .button-primary {
        background-color: var(--primary-color);
        color: white;
        padding: 12px 25px;
        font-size: 1em;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        margin-top: 1rem;
        transition: background-color 0.2s, transform 0.1s;
    }

    .button-primary:hover {
        background-color: var(--button-hover);
    }

    .button-primary:active {
        transform: scale(0.99);
    }

    .error-message {
        color: var(--error-color);
        font-size: 0.95em;
        margin-top: 1em;
        font-weight: 600;
        padding: 10px;
        border-radius: 4px;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
    }

    /* --- Footer Styles --- */
    footer {
        padding: 20px 20px;
        font-size: 12px;
        text-align: center;
        margin-top: 15px;
    }

    .caddy-logo {
        display: inline-block;
        height: 2.5em;
        margin: 0 4px;
        vertical-align: middle;
    }

    /* --- Dark Mode Styles --- */
    @media (prefers-color-scheme: dark) {
        :root {
            /* Dark Mode Overrides */
            --text-color: #e5e5e5;
            --primary-color: #6daaf3;
            --background-color: #1a1f26;
            --container-bg: #222b36;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --border-color: #3f4a59;
            --input-bg: #2b3540;
            --button-hover: #8cbdf7;
        }

        /* Background gradient applied to HTML to cover full scroll area */
        html {
            background: linear-gradient(180deg, rgb(34 50 66) 0%, rgb(26 31 38) 100%);
            background-attachment: fixed;
        }

        body {
            background: none;
            background-attachment: none;
        }

        h1 {
            color: white;
        }

        .description {
            color: var(--text-color);
        }

        input[type="password"] {
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        input[type="password"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(109, 170, 243, 0.3);
        }

        .button-primary {
            background-color: var(--primary-color);
            color: #101720;
        }

        .button-primary:hover {
            background-color: var(--button-hover);
            color: #101720;
        }

        .error-message {
            color: #ff6b6b;
            background-color: #4a1f1f;
            border: 1px solid #6e3030;
        }

        /* Dark Mode SVG Overrides */
        footer {
            color: #ccc;
        }

        /* Selectors matching target CSS to invert Caddy logo colors */
        .caddy-logo #Wordmark path,
        .caddy-logo #R path {
            fill: #ccc !important;
        }
        .caddy-logo #R circle {
            stroke: #ccc !important;
        }
    }
</style>

</head>
    <body>
        <div class="container">
            <h1>Password Required</h1>
            <form method="POST" action="">
                <div class="form-group">
                    <input
                    type="password"
                    name="sp_password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                    autofocus
                    >
                </div>
                <button type="submit" class="button-primary">Submit</button>
            </form>
            {{- if .ErrorMessage }}
            <p class="error-message">{{ .ErrorMessage }}</p>
            {{- end }}
        </div>
    </body>
</html>
